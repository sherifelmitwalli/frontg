name: self-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (version floors)
        run: python -m pip install -r requirements.txt
      - name: Run synthetic-harness self-tests
        run: python test_synthetic_harness.py

  test-locked:
    # Reproducibility job: exact archived environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run synthetic-harness self-tests (locked env)
        run: python test_synthetic_harness.py
